# Machine-specific toolchain setup for building crates/media_ffmpeg (and, in
# future, anything else linking FFmpeg). See docs/decisions-log.md for why
# each of these exists. Paths are specific to this machine's tool install
# locations under C:\Users\aashw\tools — not portable, and not meant to be;
# a future contributor on a different machine needs their own equivalents.

[env]
FFMPEG_DIR = "C:/Users/aashw/tools/ffmpeg-n7.1-latest-win64-gpl-shared-7.1"
LIBCLANG_PATH = "C:/Users/aashw/tools/libclang-pip/clang/native"
BINDGEN_EXTRA_CLANG_ARGS = "--target=x86_64-w64-mingw32 -IC:/Users/aashw/tools/mingw64/x86_64-w64-mingw32/include -IC:/Users/aashw/tools/mingw64/lib/gcc/x86_64-w64-mingw32/16.1.0/include"
