[package]
name = "media_ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
media = { workspace = true }
ffmpeg-next = "7"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# Dev-only on purpose: `timeline` must not be a real dependency of this crate
# (docs/architecture.md's dependency direction — the media layer knows nothing
# about the edit model). But the duplicated TIMEBASE constant needs a test that
# actually compares against the original, so the test build pulls it in.
timeline = { workspace = true }
