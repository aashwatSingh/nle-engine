[package]
name = "integrity"
version.workspace = true
edition.workspace = true
license.workspace = true

# SHA-256 pinning for the native binaries and model files loaded from outside
# the build — see src/lib.rs. `sha2` and `tempfile` are already in the tree
# (media_ffmpeg uses both), so this adds no new third-party code.
[dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
